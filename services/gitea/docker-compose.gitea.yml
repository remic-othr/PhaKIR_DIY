version: "3"

networks:
  proxy-net:
    external: true
  app-tier:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:1.24
    container_name: gitea
    env_file:
      - ./gitea.env
    restart: always
    networks:
      - app-tier
      - proxy-net
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - db

  db:
    image: mariadb:10.11
    restart: always
    env_file:
      - ./gitea.env
    networks:
      - app-tier
    volumes:
      - ./mysql:/var/lib/mysql


